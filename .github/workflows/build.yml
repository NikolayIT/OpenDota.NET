name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x

      - name: Restore
        run: dotnet restore src/OpenDota.NET.sln

      - name: Build
        run: dotnet build src/OpenDota.NET.sln -c Release --no-restore

      # No test step: every test in OpenDota.NET.Tests calls the live OpenDota
      # web API, so the suite depends on that service being up, unthrottled and
      # returning today's data. Run it locally with `dotnet test` when needed.
